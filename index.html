<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact Form</title>
</head>

<body>
    <div class="container">
        <header>
            <h1>HusMaa Support</h1>
            <nav class="nav-bar">
                <a href="#">
                    <li>Home</li>
                </a>
                <a href="#">
                    <li>Help</li>
                </a>
                <a href="#">
                    <li>Contact</li>
                </a>
            </nav>
            <hr>
        </header>
        <main>
            <h1>Contact Us</h1>
            <p>send us a message and We will get back to you .</p><br>
            <form>
                <div class="p-one">
                    <div class="labels">
                        <label for="">Full Name</label>
                        <label for="">Email</label>
                        <label for="">Subject</label>
                        <label for="">Message</label>
                    </div>
                    <div class="inputs">
                        <input type="text">
                        <input type="email">
                        <select name="" id="">
                            <option value="">Choose a topic</option>
                            <option value="">Request</option>
                            <option value="">Query</option>
                        </select>
                        <textarea name="" id=""></textarea>
                    </div>
                </div>
                <div class="p-two">
                    <fieldset>
                        <legend>How did you hear about us ?</legend>

                        <label for="">Search
                            <input type="radio" name="" id="">
                        </label>
                        
                        <label for="">Friend
                            <input type="radio" name="" id="">
                        </label>
                    
                        <label for="">Social Media
                            <input type="radio" name="" id="">
                        </label>
                        <br>
                        
                        <label for="">Send me Product Updates
                            <input type="checkbox" name="" id="">
                        </label>
                    </fieldset>
                </div>



                <input type="submit" value="Submit" class="ben-ten">
            </form>
        </main>
    </div>
</body>

</html>
